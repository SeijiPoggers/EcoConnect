services:
  - type: web
    name: ecoconnect-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecoconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PROFESSIONAL_INVITE_CODE
        sync: false
      - key: RATE_LIMIT_MAX
        value: "100"

databases:
  - name: ecoconnect-db
    databaseName: ecoconnect
    user: ecoconnect
    plan: free
